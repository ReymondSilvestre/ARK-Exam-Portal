<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - ARK Exam Scanner</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="mark">ARK</span><span>IT Admin</span></div>
    <nav>
      <a href="#dashboard" data-v="dashboard">Dashboard</a>
      <a href="#teachers" data-v="teachers">Teachers</a>
      <a href="#activity" data-v="activity">Activity log</a>
    </nav>
    <div class="who"><span id="who"></span><button class="btn" id="out">Sign out</button></div>
  </aside>

  <main class="main">
    <div class="top"><h1 id="title">Dashboard</h1>
      <span class="sync" id="sync" role="status"><i class="dot"></i><span>Online</span></span></div>
    <div id="msg" class="notice" hidden role="alert"></div>

    <section data-view="dashboard">
      <div class="cards">
        <div class="stat"><b id="s-teachers">-</b><span>Total teachers</span></div>
        <div class="stat"><b id="s-active">-</b><span>Active accounts</span></div>
        <div class="stat"><b id="s-exams">-</b><span>Total examinations</span></div>
        <div class="stat"><b id="s-scans">-</b><span>Scanned answer sheets</span></div>
      </div>
      <div class="panel"><h2>Recent activity</h2><div class="tablewrap"><table id="recent"></table></div></div>
    </section>

    <section data-view="teachers" hidden>
      <div class="panel">
        <h2>Add a teacher</h2>
        <form id="newT" class="row" novalidate>
          <label>Full name<input name="displayName" required></label>
          <label>Email<input name="email" type="email" required></label>
          <label>Employee ID<input name="employeeId" required></label>
          <button class="btn primary" id="addBtn">Create account</button>
        </form>
        <small>A one-time temporary password is generated. The teacher must replace it at first sign-in.</small>
      </div>
      <div class="panel">
        <div class="row"><label>Search<input id="q" placeholder="Name, email or employee ID"></label></div>
        <div class="tablewrap"><table id="teachers"></table></div>
      </div>
    </section>

    <section data-view="activity" hidden>
      <div class="panel"><div class="tablewrap"><table id="audit"></table></div></div>
    </section>
  </main>
</div>

<dialog id="dlg"><h2 id="dlgTitle"></h2><p id="dlgBody"></p>
  <code class="pw" id="dlgPw" hidden></code>
  <div class="row"><button class="btn" id="dlgCopy" hidden>Copy</button><button class="btn primary" id="dlgOk">Close</button></div>
</dialog>
<script type="module" src="js/admin.js"></script>
</body></html>
