<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - ARK Exam Scanner</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<script>
/* If the module below cannot start (a js file is missing or an old copy), say so instead of silently reloading. */
document.addEventListener("submit", function (e) {
  if (window.__arkReady) return;
  e.preventDefault();
  var m = document.getElementById("msg");
  m.textContent = "The page scripts did not load. Upload the whole js folder (auth.js, files.js, firebase-config.js, omr.js, admin.js, superadmin.js, teacher.js, student.js), then hard refresh with Ctrl+Shift+R.";
  m.className = "notice err"; m.hidden = false;
}, true);
</script>
<main class="auth-card">
  <div class="brand"><span class="mark">ARK</span><span>Exam Scanner</span></div>
  <div id="msg" class="notice" hidden role="alert"></div>

  <section id="signin">
    <h1>Sign in</h1>
    <p class="muted"><b>Teachers:</b> school code + Employee No. <b>Students:</b> Exam ID No. (for example 2026-0001), no school code. <b>IT Admin:</b> your email.</p>
    <form id="f" novalidate>
      <label>School code <small>Teachers only. Leave blank for students and IT admins.</small>
        <input id="school" autocomplete="organization" autocapitalize="characters"></label>
      <label>Employee No., Exam ID No. or email<input id="email" autocomplete="username" autocapitalize="none" required></label>
      <label>Password<input id="pw" type="password" autocomplete="current-password" required>
        <small>First time (teachers and students): your birth year + the first letter of your last name (example 2012D).</small></label>
      <button class="btn primary block" id="go">Sign in</button>
    </form>
    <p class="muted fine">No account yet? Your school's IT Administrator creates teacher accounts, and your teacher creates student accounts.</p>
  </section>

</main>
<script type="module">
import { auth, login, friendlyError, destinationFor } from "./js/auth.js";
window.__arkReady = true;
const $ = (id) => document.getElementById(id), msg = $("msg");
const show = (t, ok) => { msg.textContent = t; msg.hidden = false; msg.className = "notice " + (ok ? "ok" : "err"); };
if (new URLSearchParams(location.search).has("denied")) show("Your account does not have access to that page, or your school is not active.");
try { $("school").value = localStorage.getItem("ark.schoolCode") || ""; } catch {}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); msg.hidden = true; $("go").disabled = true;
  let c;
  try { c = await login($("email").value, $("pw").value, $("school").value); } catch (err) { show(friendlyError(err)); $("go").disabled = false; return; }
  try { try { localStorage.setItem("ark.schoolCode", $("school").value.trim().toUpperCase()); } catch {} location.href = await destinationFor(c.user); }
  catch (err) { await auth.signOut(); show(err.message); $("go").disabled = false; }
});
</script></body></html>
