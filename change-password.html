<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password - ARK Exam Scanner</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand"><span class="mark">ARK</span><span>Exam Scanner</span></div>
  <h1>Choose a new password</h1>
  <p class="muted">Your temporary password must be replaced before you continue.</p>
  <div id="msg" class="notice" hidden role="alert"></div>
  <form id="f" novalidate>
    <label>New password<input id="p1" type="password" autocomplete="new-password" required>
      <small id="rule"></small></label>
    <label>Confirm new password<input id="p2" type="password" autocomplete="new-password" required></label>
    <button class="btn primary block" id="go">Save password</button>
  </form>
  <button class="link" id="out" type="button">Sign out</button>
</main>
<script type="module">
import { requireRole, changeOwnPassword, friendlyError, homeFor, logout } from "./js/auth.js";
const $ = (id) => document.getElementById(id), msg = $("msg");
const { profile } = await requireRole(["admin", "teacher", "student"], { allowMustChange: true });
const min = profile.role === "student" ? 8 : 10;
$("rule").textContent = `At least ${min} characters, with a letter and a number.`;
const show = (t) => { msg.textContent = t; msg.hidden = false; msg.className = "notice err"; };
$("out").onclick = logout;
$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); msg.hidden = true;
  const a = $("p1").value;
  if (a.length < min || !/[A-Za-z]/.test(a) || !/\d/.test(a)) return show(`Use at least ${min} characters with a letter and a number.`);
  if (a !== $("p2").value) return show("The two passwords do not match.");
  $("go").disabled = true;
  try { await changeOwnPassword(a); location.href = homeFor(profile.role); }
  catch (err) { show(friendlyError(err)); $("go").disabled = false; }
});
</script></body></html>
